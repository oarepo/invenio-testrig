name: "Install Python and UV"
description: "Setup Python and install UV package manager"
inputs:
  python-version:
    description: "Python version to install"
    required: true
  tools-python-version:
    description: "Python version to use for the tools virtualenv."
    required: false
    default: "3.14"
  testrig-directory:
    description: "Directory where invenio-testrig is located"
    required: true
  hook-libraries:
    description: |
      Space-separated list of libraries to install to the invenio-testrig environment.
      They can contain entrypoints for hooks, which will be used during testing.
      Format: "library1[extra1,extra2] library2[extra3]".
      File paths and github URLs are also supported.
    required: false
    default: ""
  install-invenio-cli:
    description: |
      Install invenio-cli (needed for end-to-end tests) into its own virtualenv and
      expose it on PATH. Only the invenio-cli and pipenv executables are linked, so
      neither the global python nor the tools virtualenv is affected by its dependencies.
      Enabled by default; set to false in a job that does not need it.
    required: false
    default: "true"
  invenio-cli-python-version:
    description: |
      Python interpreter for the invenio-cli virtualenv. Pin this to an older Python
      (e.g. 3.12) if invenio-cli or its dependencies ever lag behind the newest one.
    required: false
    default: "3.14"
runs:
  using: "composite"
  steps:
    - name: Set up OS requirements
      shell: bash
      run: |
        echo "::group::Setting up OS requirements"
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive \
          apt-get install -y -qq \
            tree \
            graphviz imagemagick \
            libssl-dev libffi-dev \
            libxml2-dev libxslt1-dev zlib1g-dev \
            libcairo2-dev pkg-config \
            fonts-dejavu imagemagick \
            libpq-dev libjpeg-dev
        echo "::endgroup::"

    # set up 3.14 if python-version is not 3.14.x
    - name: Setup Python
      uses: actions/setup-python@v6
      if: ${{ !startsWith(inputs.python-version, '3.14') }}
      with:
        python-version: ${{ inputs.tools-python-version }}

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv/uvx
      uses: astral-sh/setup-uv@v7
      with:
        version: latest
        python-version: ${{ inputs.python-version }}
        enable-cache: false

    - name: Create tools virtualenv
      shell: bash
      run: |
        echo "::group::Creating tools virtualenv"
        cd "${{ inputs.testrig-directory }}"

        # create a virtualenv for the tools and install the tools
        uv venv .tools-venv --python ${{ inputs.tools-python-version }}
        source .tools-venv/bin/activate
        uv pip install --python ${{ inputs.tools-python-version }} -e "${{ inputs.testrig-directory }}"

        if [ -n "${{ inputs.hook-libraries }}" ]; then
          echo "Installing hook libraries: ${{ inputs.hook-libraries }}"
          # Use array to properly handle special characters while splitting on spaces
          read -ra libs <<< "${{ inputs.hook-libraries }}"
          uv pip install --python ${{ inputs.tools-python-version }} "${libs[@]}"
        fi

        # create an extra directory that will contain linked tools.
        # we do not want the virtualenv bin directory to be in PATH because
        # it might conflict with the other venvs we will be installing later.

        mkdir -p .tools
        ln -s $PWD/.tools-venv/bin/invenio-testrig .tools/invenio-testrig
        ln -s $PWD/.tools-venv/bin/black .tools/black

        echo "Adding .tools to PATH"
        echo "PATH=$(pwd)/.tools:$PATH" >> $GITHUB_ENV

        echo "::endgroup::"
        echo "✓ Tools virtualenv created"

    - name: Install invenio-cli
      if: ${{ inputs.install-invenio-cli == 'true' }}
      shell: bash
      run: |
        echo "::group::Installing invenio-cli"
        TOOLS_DIR="${{ inputs.testrig-directory }}/.tools"
        CLI_VENV="${RUNNER_TEMP}/invenio-cli-venv"

        # run from a neutral directory so that the commands are not influenced
        # by the project metadata of the checkout the step is running in
        cd "$RUNNER_TEMP"

        # invenio-cli gets a virtualenv of its own, so that neither the global python
        # nor the tools virtualenv is affected by its (many) dependencies. It is
        # created outside of the checkout to not be influenced by the project metadata.
        uv venv "$CLI_VENV" --python ${{ inputs.invenio-cli-python-version }}
        uv pip install --python "$CLI_VENV/bin/python" invenio-cli

        # Only the executables needed on PATH are linked into .tools: invenio-cli
        # itself and pipenv, which invenio-cli runs as a subprocess.
        for exe in invenio-cli pipenv; do
          if [ -x "$CLI_VENV/bin/$exe" ]; then
            ln -sf "$CLI_VENV/bin/$exe" "$TOOLS_DIR/$exe"
          else
            echo "::warning::$exe not found in the invenio-cli virtualenv"
          fi
        done

        invenio-cli --version
        echo "::endgroup::"
        echo "✓ invenio-cli installed"

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Prepare git
      shell: bash
      run: |
        echo "::group::Preparing git"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        echo "::endgroup::"
