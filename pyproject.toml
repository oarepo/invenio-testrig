[project]
name = "invenio-testrig"
version = "0.1.0"
description = "Automated integration test runner for Invenio modules"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.1.0",
    "boto3>=1.42.72",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lark>=1.3.1",
    "marshmallow>=4.2.2",
    "marshmallow-dataclass>=8.7.1",
    "marshmallow-polyfield>=5.11",
    "psutil>=6.0.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "semver>=3.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest-dotenv>=0.5.2",
    "pytest-invenio>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0",
    "respx>=0.21.1",
    "types-pyyaml>=6.0.12",
    "pytest-cov>=7.0.0",
    "Sphinx>=4.5.0",
    "sphinx-pyproject",
]

[build-system]
requires = ["uv_build>=0.10.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.scripts]
invenio-testrig = "invenio_testrig.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=invenio_testrig",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
env_files = [".env"]

[tool.sphinx-pyproject]
source-dir = "docs/"
build-dir = "docs/_build"
all_files = 1
